<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>subbr: a friend invited you</title>
<link rel="icon" href="favicon.png">
<style>
  :root { --bg:#0B0A1A; --card:#1A1830; --text:#F4F1FF; --muted:#B9B2D6; --accent:#A78BFA; --line:rgba(255,255,255,.12); }
  @media (prefers-color-scheme: light) { :root { --bg:#F7F6FB; --card:#FFFFFF; --text:#1B1830; --muted:#5D5878; --accent:#6D4FD8; --line:rgba(0,0,0,.1); } }
  body { margin:0; background:var(--bg); color:var(--text); font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:480px; margin:0 auto; padding:56px 24px; text-align:center; }
  .brand { color:var(--accent); font-weight:800; letter-spacing:.08em; margin:0; }
  h1 { font-size:1.8rem; line-height:1.25; margin:.4em 0 .5em; }
  p { color:var(--muted); }
  a.button { display:block; margin:28px 0 12px; padding:16px; border-radius:16px; background:var(--accent); color:#fff; font-weight:800; text-decoration:none; font-size:1.1rem; }
</style>
</head>
<body>
<main>
  <p class="brand">SUBBR</p>
  <h1 id="title">A friend wants to send you secret messages</h1>
  <p>subbr hides a private message inside an ordinary text or photo. Get it free, open it, and your friend is already added.</p>
  <a class="button" id="go" href="https://play.google.com/store/apps/details?id=com.subbr.app">Open subbr</a>
  <p><small>Nothing in this link is sent to this website: it stays on your phone.</small></p>
</main>
<script>
// The invite after "#" (the inviter's public key and name) never reaches the server.
// subbr opens it directly when installed (Android App Link). This page is the fallback:
// open subbr through an intent, or, if it isn't installed, the Play Store, which hands
// the invite to the app after install (Install Referrer).
(function () {
  var card = location.hash.slice(1);
  if (!/^[A-Za-z0-9._~%:-]{1,600}$/.test(card)) return;
  var referrer = 'utm_source=invite&utm_medium=link&utm_content=' + card;
  var play = 'https://play.google.com/store/apps/details?id=com.subbr.app&referrer=' + encodeURIComponent(referrer);
  var intent = 'intent://mypttwo.github.io/subbr/c#Intent;scheme=https;package=com.subbr.app;S.subbr_card=' + encodeURIComponent(card) +
    ';S.browser_fallback_url=' + encodeURIComponent(play) + ';end';
  var go = document.getElementById('go');
  go.href = /Android/i.test(navigator.userAgent) ? intent : play;
  try {
    var name = decodeURIComponent(card.split(':')[2] || '');
    if (name) document.getElementById('title').textContent = name + ' wants to send you secret messages';
  } catch (e) {}
})();
</script>
</body>
</html>
